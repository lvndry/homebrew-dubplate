name: Update Dubplate packages

on:
  workflow_dispatch:
  schedule:
    - cron: "28 8 * * *"

permissions:
  contents: write

concurrency:
  group: update-dubplate-packages
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find the latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/lvndry/dubplate/releases/latest --jq .tag_name)
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected stable Dubplate release tag: $tag"
            exit 1
          fi

          version=${tag#v}
          tarball="dubplate-$version-aarch64-apple-darwin.tar.gz"
          if grep -Fqx "  version \"$version\"" Casks/dubplate.rb &&
             grep -Fqx "  url \"https://github.com/lvndry/dubplate/releases/download/$tag/$tarball\"" Formula/dubplate.rb; then
            echo "The tap already packages Dubplate $tag."
            exit 0
          fi

          commit=$(gh api "repos/lvndry/dubplate/commits/$tag" --jq .sha)
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve $tag to a Dubplate commit"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Verify the release and regenerate packages
        if: steps.release.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          generator="$RUNNER_TEMP/publish-homebrew.py"
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/lvndry/dubplate/$RELEASE_COMMIT/scripts/publish-homebrew.py" \
            --output "$generator"
          python3 "$generator" "$RELEASE_TAG" "$GITHUB_WORKSPACE"

      - name: Publish updated packages
        if: steps.release.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git add Casks/dubplate.rb Formula/dubplate.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Update Dubplate to $RELEASE_TAG"
          git push
